name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund

      # The vendored definition is generated. Running the generator and
      # diffing is what stops a stale copy shipping under a fresh version.
      - name: Definition is in sync with the dependency
        run: npm run sync && git diff --exit-code src/languages/carve.js

      - run: npm test
