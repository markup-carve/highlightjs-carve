name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund

      # The vendored definition is generated. Running the generator and
      # diffing is what stops a stale copy shipping under a fresh version.
      - name: Definition is in sync with the dependency
        run: npm run sync && git diff --exit-code src/languages/carve.js

      - run: npm test
